<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>中間課題</title>
  <style>
    .type-tab.active {
      background-color: dimgray;
      color: whitesmoke;
    }
  </style>
</head>
<body class="container py-4">
  <h1 class="mb-3">キャラ図鑑</h1>
  <p>
    <button class="type-tab">すべて</button>
    <button class="type-tab">炎</button>
    <button class="type-tab">水</button>
    <button class="type-tab">草</button>
    <span id="resultCount"></span>
  </p>
  <p class="mb-3">
    <input id="searchInput" placeholder="名前で検索">
    <select id="sortSelect">
      <option value="default">登録順</option>
      <option value="attackDesc">攻撃力が高い順</option>
      <option value="attackAsc">攻撃力が低い順</option>
      <option value="rarityLevel">レアリティ順</option>
    </select>
  </p>
  <ul id="characterList" class="list-unstyled row g-3"></ul>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script src="https://morimorihoge.github.io/teu2026f/characters.js"></script>
  <script src="main.js"></script>
</body>
</html>
